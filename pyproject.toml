[project]
name = "google-books-tw-mcp"
version = "1.1.0"
description = "專為臺灣繁體出版品市場打造的書目元資料解析與事實層 (Taiwan Book Metadata Resolver) MCP 伺服器"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "etrnya" }
]
keywords = ["mcp", "google-books", "taiwan", "traditional-chinese", "isbn", "reading", "notion"]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0"
]

[project.scripts]
google-books-tw-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
